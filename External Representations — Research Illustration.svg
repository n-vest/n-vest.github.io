<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 778 844" width="778" height="844" role="img" aria-labelledby="title desc">
<title id="title">Mathematical patterns and external representations</title>
<desc id="desc">Rows of 2, 4, 6, 8, and 10 dots illustrate f(n)=2n. Square dot arrays of sizes 1 by 1, 3 by 3, and 5 by 5 illustrate f(n)=(2n-1) squared.</desc>
<defs>
  <circle id="dot" r="12.5"/>
  <g id="pair"><use href="#dot" x="0"/><use href="#dot" x="42"/></g>
  <g id="row3"><use href="#dot" x="0"/><use href="#dot" x="32"/><use href="#dot" x="64"/></g>
  <g id="row5"><use href="#dot" x="0"/><use href="#dot" x="32"/><use href="#dot" x="64"/><use href="#dot" x="96"/><use href="#dot" x="128"/></g>
</defs>
<!-- Top: five rows of even numbers. No background fill. -->
<g fill="#A7ADB0">
  <use href="#pair" x="114" y="66"/>
  <use href="#pair" x="114" y="134"/><use href="#pair" x="198" y="134"/>
  <use href="#pair" x="114" y="202"/><use href="#pair" x="198" y="202"/><use href="#pair" x="282" y="202"/>
  <use href="#pair" x="114" y="270"/><use href="#pair" x="198" y="270"/><use href="#pair" x="282" y="270"/><use href="#pair" x="366" y="270"/>
  <use href="#pair" x="114" y="338"/><use href="#pair" x="198" y="338"/><use href="#pair" x="282" y="338"/><use href="#pair" x="366" y="338"/><use href="#pair" x="450" y="338"/>
</g>
<g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#30383D" text-anchor="middle">
  <text x="597" y="74">2</text><text x="597" y="142">4</text><text x="597" y="210">6</text><text x="597" y="278">8</text><text x="597" y="346">10</text>
  <text x="389" y="443">f(n) = 2n</text>
</g>
<!-- Bottom: square numbers -->
<g fill="#A7ADB0"><use href="#dot" x="53" y="635"/></g>
<g fill="#8FAE9F">
  <use href="#row3" x="331" y="603"/>
  <use href="#row3" x="331" y="635"/>
  <use href="#row3" x="331" y="667"/>
</g>
<g fill="#159271">
  <use href="#row5" x="609" y="571"/>
  <use href="#row5" x="609" y="603"/>
  <use href="#row5" x="609" y="635"/>
  <use href="#row5" x="609" y="667"/>
  <use href="#row5" x="609" y="699"/>
</g>
<g stroke="#B7C5C7" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 12" fill="none">
  <path d="M130 635 H239"/><path d="M462 635 H554"/>
</g>
<g font-family="Inter, Arial, sans-serif" font-size="23" fill="#30383D" text-anchor="middle">
  <text x="53" y="750">1×1</text>
  <text x="363" y="750">3×3</text>
  <text x="673" y="750">5×5</text>
  <text x="389" y="817">f(n) = (2n − 1)²</text>
</g>
</svg>
